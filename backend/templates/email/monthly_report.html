<!DOCTYPE html>
<html lang="{{ language }}" dir="{{ direction }}">
  <head><meta charset="utf-8" /><title>{{ subject }}</title></head>
  <body style="margin:0;padding:24px;background:#f5f6f8;font-family:Arial,'Noto Sans Arabic',sans-serif;color:#111;direction:{{ direction }};">
    <table role="presentation" style="max-width:560px;margin:0 auto;background:#fff;border-radius:8px;padding:24px;">
      <tr><td>
        <h1 style="margin:0 0 8px;font-size:18px;">{{ subject }}</h1>
        <p style="margin:0 0 16px;color:#555;font-size:14px;">{{ intro }}</p>

        <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;">
          {% for row in rows %}
            <tr>
              <td style="padding:6px 0;color:#555;">{{ row.label }}</td>
              <td style="padding:6px 0;text-align:{{ amount_align }};font-weight:bold;direction:ltr;">{{ row.value }}</td>
            </tr>
          {% endfor %}
        </table>

        <p style="margin:20px 0 0;color:#777;font-size:12px;">{{ footer }}</p>
      </td></tr>
    </table>
  </body>
</html>
